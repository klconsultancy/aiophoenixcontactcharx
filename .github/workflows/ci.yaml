name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  # The newest-modbus-connection job warns about a new release before Home Assistant ships it.
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check --output-format=github
      - run: uv run mypy

  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest

  # Home Assistant pins modbus-connection per release, so the lower bound must keep working.
  test-lowest:
    name: pytest (lowest modbus-connection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - name: Install the lowest supported modbus-connection
        run: |
          lowest=$(sed -nE 's|^    "modbus-connection>=([0-9.]+)",$|\1|p' pyproject.toml)
          if [ -z "$lowest" ]; then
            echo "::error::no modbus-connection lower bound found in pyproject.toml"
            exit 1
          fi
          uv pip install "modbus-connection[tmodbus]==$lowest"
      - run: uv pip show modbus-connection tmodbus
      - run: uv run --no-sync pytest --no-cov

  # There is no upper bound, so a new major version must be caught here, pre-releases included.
  test-newest:
    name: pytest (newest modbus-connection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv pip install --upgrade --prerelease allow "modbus-connection[tmodbus]"
      - run: uv pip show modbus-connection tmodbus
      - run: uv run --no-sync pytest --no-cov

  # The distribution that a release publishes, built but not uploaded, so a broken
  # pyproject.toml, or metadata PyPI would reject, shows up before a release.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv build
      - run: uv run --locked --only-group release twine check --strict dist/*

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # Single required status check for the branch ruleset.
  ci-success:
    name: CI success
    if: always()
    needs: [lint, tests, test-lowest, test-newest, build, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
