name: Release

# release-please keeps a release pull request open with the next version and its
# changelog, from the Conventional Commits titles on main. Merging it tags the release
# and creates the GitHub release; this workflow then builds the distribution and
# publishes it to PyPI through trusted publishing (this file and the "pypi"
# environment are what PyPI trusts, so keep both names).
#
# A release candidate is a tag such as v1.2.3-rc.1 on main, pushed by an admin (the
# "release tags" ruleset). This workflow builds it with the version from the tag
# (1.2.3rc1), publishes it to PyPI, where pip installs it only when asked for, and
# creates a GitHub pre-release. release-please doesn't see it, so the notes of the
# release after it still list every change since the last release. Don't make a
# release candidate with release-as and prerelease: release-please would then count
# it as the previous release and leave its changes out of the final release's notes.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]

permissions: {}

jobs:
  release-please:
    name: Release PR
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A GitHub App token instead of GITHUB_TOKEN, so CI runs on the release PR. The
      # app may also create the version tags the "release tags" ruleset protects.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  build:
    needs: release-please
    # On a tag, release-please is skipped, which would skip this job too without always().
    if: >-
      always() && (needs.release-please.outputs.release_created == 'true' ||
      (github.ref_type == 'tag' && needs.release-please.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Release candidate version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::$TAG is not on main"
            exit 1
          }
          version="${TAG#v}"
          uv version --frozen "${version/-rc./rc}"
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 5

  # Separate from the build, so only this job holds the OIDC token PyPI trusts. The
  # action also uploads a signed attestation of each file.
  publish:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aiophoenixcontactcharx
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # After PyPI has it, so the pre-release never points at a version pip can't find.
  pre-release:
    needs: publish
    if: always() && github.ref_type == 'tag' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the pre-release
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --generate-notes --title "$TAG"
