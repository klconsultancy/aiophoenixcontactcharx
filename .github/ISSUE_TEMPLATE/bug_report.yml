name: Bug report
description: The library reads or writes a CHARX controller wrongly, or fails talking to it.
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Debug logs of `aiophoenixcontactcharx` and `pymodbus` around the failure.
      render: text
  - type: input
    id: library-version
    attributes:
      label: aiophoenixcontactcharx version
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: CHARX controller model and firmware version
      placeholder: CHARX SEC-3100, firmware 1.7.3
    validations:
      required: true
  - type: input
    id: pymodbus-version
    attributes:
      label: pymodbus version
